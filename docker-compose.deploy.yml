version: '3.8'

services:
  # 前端+后端（nginx反向代理）
  web:
    image: ghcr.io/hbpc002/address-inquiry-rate-report:latest
    container_name: schedule-report
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./schedule.db:/app/backend/schedule.db
    restart: unless-stopped

  # 可选：分离的 PostgreSQL
