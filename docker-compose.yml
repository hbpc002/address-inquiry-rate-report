version: '3.8'

services:
  web:
    image: ghcr.io/hbpc002/address-inquiry-rate-report-frontend:latest
    container_name: schedule-web
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    restart: unless-stopped

  api:
    image: ghcr.io/hbpc002/address-inquiry-rate-report-backend:latest
    container_name: schedule-api
    ports:
      - "8000:8000"
    volumes:
      - ./schedule.db:/app/schedule.db
    environment:
      - DATABASE_URL=sqlite:///./schedule.db
    restart: unless-stopped
