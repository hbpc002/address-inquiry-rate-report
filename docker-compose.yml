version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DATABASE_URL=sqlite:///./schedule.db
    volumes:
      - ./schedule.db:/app/backend/schedule.db
    restart: unless-stopped

