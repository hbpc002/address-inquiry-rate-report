version: '3.8'

services:
  web:
    image: ghcr.io/hbpc002/address-inquiry-rate-report-frontend:latest
    container_name: schedule-web
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    restart: unless-stopped

  api:
    image: ghcr.io/hbpc002/address-inquiry-rate-report-backend:latest
    container_name: schedule-api
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://postgres:admin123@kf@db:5432/schedule
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: schedule-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin123@kf
      - POSTGRES_DB=schedule
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
